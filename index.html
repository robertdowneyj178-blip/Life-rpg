<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14162B;
    --surface:#1F2242;
    --surface-2:#262A52;
    --line:#3A3F72;
    --gold:#D9A441;
    --gold-dim:#8F723A;
    --text:#EDEAE0;
    --text-dim:#9599C2;
    --green:#6FCF97;
    --red:#E2725B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Cinzel', serif;
    letter-spacing:0.02em;
    margin:0;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:20px 16px 100px;
  }
  .char-header{
    display:flex;
    align-items:center;
    gap:14px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:20px;
  }
  .level-badge{
    width:56px;height:56px;
    flex-shrink:0;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    font-size:18px;font-weight:600;color:var(--gold);
    background:var(--surface);
  }
  .char-info h1{font-size:19px;color:var(--text);}
  .char-info .xp-line{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .bar-track{
    height:6px;background:var(--surface-2);border:1px solid var(--line);
    margin-top:6px;overflow:hidden;
  }
  .bar-fill{height:100%;background:var(--gold);transition:width .3s;}
  .section{margin-bottom:26px;}
  .section-title{
    font-size:14px;color:var(--gold);text-transform:none;
    margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .stat-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 0;border-bottom:1px solid var(--line);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-name{width:88px;font-size:12px;color:var(--text);flex-shrink:0;}
  .stat-row .bar-track{flex:1;margin:0;}
  .stat-lvl{width:34px;text-align:right;font-size:12px;color:var(--text-dim);}
  .task{
    display:flex;align-items:flex-start;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line);
  }
  .task:last-child{border-bottom:none;}
  .task input[type=checkbox]{
    width:20px;height:20px;flex-shrink:0;margin-top:2px;
    accent-color:var(--gold);
  }
  .task-body{flex:1;}
  .task-name{font-size:13px;}
  .task-meta{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .task-name.done{color:var(--green);text-decoration:line-through;}
  .task-del{
    background:none;border:none;color:var(--text-dim);
    font-size:16px;cursor:pointer;padding:0 4px;
  }
  .quest{
    border:1px solid var(--gold-dim);
    background:var(--surface);
    padding:12px;margin-bottom:10px;
  }
  .quest-name{font-size:13px;color:var(--gold);margin-bottom:4px;}
  .quest-reward{font-size:11px;color:var(--text-dim);margin-bottom:8px;}
  .quest button{width:100%;}
  button{
    font-family:'JetBrains Mono', monospace;
    background:var(--surface-2);
    color:var(--text);
    border:1px solid var(--line);
    padding:9px 12px;font-size:12px;
    cursor:pointer;
  }
  button.primary{
    background:var(--gold);color:#14162B;border-color:var(--gold);font-weight:600;
  }
  button:active{transform:scale(0.98);}
  .add-task-btn{width:100%;margin-top:8px;}
  input[type=text], input[type=number], select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);
    color:var(--text);padding:8px;font-family:'JetBrains Mono',monospace;
    font-size:13px;margin-top:4px;
  }
  label{font-size:11px;color:var(--text-dim);display:block;margin-top:10px;}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .form-actions button{flex:1;}
  .modal-backdrop{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);
    align-items:flex-end;justify-content:center;z-index:10;
    overflow-y:auto;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);border-top:1px solid var(--line);
    width:100%;max-width:480px;padding:20px 16px 28px;
  }
  .radio-row{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);margin:0;}
  .stat-check-list{
    display:flex;flex-direction:column;gap:6px;margin-top:6px;
    background:var(--surface-2);border:1px solid var(--line);padding:8px;
  }
  .stat-check-list label{
    display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin:0;
  }
  .hidden{display:none !important;}
  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--gold);color:#14162B;padding:8px 16px;font-size:12px;
    font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .fat-track{position:relative;margin-top:14px;}
  .fat-track .bar-track{height:10px;}
  .fat-ticks{
    display:flex;justify-content:space-between;
    font-size:10px;color:var(--text-dim);margin-top:4px;
  }
  .fat-label{font-size:12px;color:var(--text-dim);margin-bottom:2px;}
</style>
</head>
<body>
<div class="app">

  <div class="char-header">
    <div class="level-badge" id="charLevelBadge">1</div>
    <div class="char-info">
      <h1>Your character</h1>
      <div class="xp-line" id="charXpLine">0 / 100 XP to next level</div>
      <div class="bar-track"><div class="bar-fill" id="charXpBar" style="width:0%"></div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Stats</div>
    <div id="statsList"></div>
  </div>

  <div class="section">
    <div class="section-title">Fat loss tracker</div>
    <div class="fat-label" id="fatLabel">0.0 / 10 kg lost</div>
    <div class="fat-track">
      <div class="bar-track"><div class="bar-fill" id="fatBar" style="width:0%"></div></div>
      <div class="fat-ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10kg</span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Today's quests</div>
    <div id="taskList"></div>
    <button class="add-task-btn" onclick="openTaskModal()">+ Add task</button>
  </div>

  <div class="section">
    <div class="section-title">Side quests</div>
    <div id="sideQuestList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="taskModal">
  <div class="modal">
    <h2 style="font-size:16px;margin-bottom:4px;">New quest</h2>
    <label>Name</label>
    <input type="text" id="newTaskName" placeholder="e.g. Read 10 pages" />

    <label>Stats this feeds (pick one or more)</label>
    <div class="stat-check-list" id="statCheckList"></div>

    <label>New stat name (optional, adds & selects it)</label>
    <input type="text" id="newStatName" placeholder="Leave blank if not needed" />

    <label>Repeats every (days) &mdash; 1 = every day</label>
    <input type="number" id="newTaskFrequency" value="1" min="1" />

    <label>Type</label>
    <div class="radio-row">
      <label><input type="radio" name="taskType" value="simple" checked onchange="toggleProgressiveFields()"> Simple</label>
      <label><input type="radio" name="taskType" value="progressive" onchange="toggleProgressiveFields()"> Progressive</label>
    </div>
    <div id="progressiveFields" class="hidden">
      <label>Starting target (e.g. reps, minutes)</label>
      <input type="number" id="newTaskTarget" value="10" min="1" />
      <label>Grows by</label>
      <input type="number" id="newTaskGrowth" value="2" min="1" />
      <label>Every how many successful days (difficulty growth)</label>
      <input type="number" id="newTaskInterval" value="7" min="1" />
    </div>

    <label style="margin-top:14px;">
      <input type="checkbox" id="newTaskIsDeficit" style="width:auto;display:inline-block;margin-right:6px;" />
      This task represents hitting a ~500 kcal deficit (feeds the fat loss tracker)
    </label>

    <div class="form-actions">
      <button onclick="closeTaskModal()">Cancel</button>
      <button class="primary" onclick="saveNewTask()">Add quest</button>
    </div>
  </div>
</div>

<script>
const DONE_XP = 10;
const SKIP_PENALTY = 4;
const LEVEL_BASE_XP = 100;
const KCAL_PER_KG = 7700;
const DEFICIT_PER_TASK = 500;
const FAT_GOAL_KG = 10;

const DEFAULT_STATS = ['discipline','hygiene','fitness','charm'];

const DEFAULT_TASKS = [
  {name:'Wake up at 6am', stats:['discipline'], type:'simple'},
  {name:'Clean room', stats:['discipline','hygiene'], type:'simple'},
  {name:'Take a bath', stats:['hygiene'], type:'simple'},
  {name:'Wash clothes', stats:['hygiene'], type:'simple', frequency:3},
  {name:'Eat healthy', stats:['fitness','discipline'], type:'simple'},
  {name:'Hit 500 cal deficit', stats:['fitness','discipline'], type:'simple', isDeficitTask:true},
  {name:'Do exercises', stats:['fitness','discipline','charm'], type:'progressive', target:10, growth:2, interval:7},
  {name:'Practice music', stats:['charm','discipline'], type:'simple'},
  {name:'Create content', stats:['charm','discipline'], type:'simple'}
];

const QUEST_POOL = [
  {name:'Stretch for 5 minutes', reward:{fitness:6}, overallXP:8},
  {name:'Drink a full glass of water', reward:{fitness:4}, overallXP:6},
  {name:'Tidy one small area', reward:{discipline:6}, overallXP:8},
  {name:'Journal for 5 minutes', reward:{charm:6}, overallXP:8},
  {name:'Call or message someone you care about', reward:{charm:8}, overallXP:10},
  {name:'Read one chapter of a book', reward:{discipline:8}, overallXP:10},
  {name:'Learn one new thing about your craft', reward:{charm:8}, overallXP:10},
  {name:'Declutter one drawer or surface', reward:{discipline:6}, overallXP:8}
];

let state = null;

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function addDaysToStr(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0,10);
}

function buildRewards(statsArr){
  const rewards = {};
  const weight = 1 / statsArr.length;
  statsArr.forEach(s => { rewards[s] = weight; });
  return rewards;
}

function makeDefaultState(){
  const stats = {};
  DEFAULT_STATS.forEach(s => stats[s] = {xp:0, level:1});
  const today = todayStr();
  const tasks = DEFAULT_TASKS.map((t,i) => ({
    id: 't'+i,
    name: t.name,
    rewards: buildRewards(t.stats),
    type: t.type,
    frequency: t.frequency || 1,
    nextDueDate: today,
    target: t.target || null,
    growth: t.growth || null,
    interval: t.interval || null,
    originalTarget: t.target || null,
    streak: 0,
    doneToday: false,
    isDeficitTask: !!t.isDeficitTask
  }));
  const pool = QUEST_POOL.map((q,i) => ({...q, id:'q'+i}));
  const active = pool.splice(0,3);
  return {
    charLevel: 1,
    charXP: 0,
    lastActiveDate: today,
    stats,
    tasks,
    questPool: pool,
    activeQuests: active,
    fatLossKcal: 0
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem('liferpg_save');
    if(!raw) return makeDefaultState();
    const parsed = JSON.parse(raw);
    if(typeof parsed.fatLossKcal !== 'number') parsed.fatLossKcal = 0;
    parsed.tasks.forEach(t => {
      if(!t.frequency) t.frequency = 1;
      if(!t.nextDueDate) t.nextDueDate = todayStr();
      if(t.isDeficitTask === undefined) t.isDeficitTask = false;
      if(!t.rewards){
        t.rewards = t.stat ? {[t.stat]: 1} : {discipline: 1};
      }
    });
    return parsed;
  }catch(e){
    console.error('Could not load save, starting fresh.', e);
    return makeDefaultState();
  }
}

function saveState(){
  try{
    localStorage.setItem('liferpg_save', JSON.stringify(state));
  }catch(e){
    console.error('Could not save progress.', e);
    showToast('Could not save — storage may be full or blocked.');
  }
}

function processDay(dateStr){
  state.tasks.forEach(task => {
    const isDaily = task.frequency <= 1;
    const wasDueThisDay = isDaily || dateStr === task.nextDueDate;
    if(wasDueThisDay){
      if(!task.doneToday){
        Object.entries(task.rewards).forEach(([statKey, weight]) => {
          addStatXP(statKey, -Math.round(SKIP_PENALTY * weight));
        });
      }
      if(!isDaily){
        task.nextDueDate = addDaysToStr(task.nextDueDate, task.frequency);
      }
    }
    task.doneToday = false;
  });
}

function processRollover(){
  const today = todayStr();
  let cursor = state.lastActiveDate;
  let guard = 0;
  while(cursor < today && guard < 3650){
    const nextDay = addDaysToStr(cursor, 1);
    processDay(nextDay);
    cursor = nextDay;
    guard++;
  }
  state.lastActiveDate = today;
  saveState();
}

function xpToNext(level){
  return level * LEVEL_BASE_XP;
}

function addStatXP(statKey, amount){
  const stat = state.stats[statKey];
  if(!stat) return;
  stat.xp += amount;
  if(stat.xp < 0) stat.xp = 0;
  while(stat.xp >= xpToNext(stat.level)){
    stat.xp -= xpToNext(stat.level);
    stat.level += 1;
  }
}

function addCharXP(amount){
  state.charXP += amount;
  if(state.charXP < 0) state.charXP = 0;
  while(state.charXP >= xpToNext(state.charLevel)){
    state.charXP -= xpToNext(state.charLevel);
    state.charLevel += 1;
    showToast('Level up! You are now level ' + state.charLevel);
  }
}

function taskTotalXP(task){
  let xp = DONE_XP;
  if(task.type === 'progressive'){
    xp = Math.round(DONE_XP * (task.target / task.originalTarget));
  }
  return xp;
}

function isTaskDueToday(task){
  return task.frequency <= 1 || task.nextDueDate === todayStr();
}

function toggleTask(taskId, checked){
  const task = state.tasks.find(t => t.id === taskId);
  if(!task) return;
  task.doneToday = checked;

  const totalXP = taskTotalXP(task);
  const sign = checked ? 1 : -1;

  Object.entries(task.rewards).forEach(([statKey, weight]) => {
    addStatXP(statKey, sign * Math.round(totalXP * weight));
  });
  addCharXP(sign * Math.round(totalXP / 2));

  if(checked && task.type === 'progressive'){
    task.streak += 1;
    if(task.streak >= task.interval){
      task.target += task.growth;
      task.streak = 0;
    }
  }

  if(task.isDeficitTask){
    state.fatLossKcal = Math.max(0, state.fatLossKcal + sign * DEFICIT_PER_TASK);
  }

  saveState();
  render();
}

function deleteTask(taskId){
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  saveState();
  render();
}

function completeQuest(questId){
  const quest = state.activeQuests.find(q => q.id === questId);
  if(!quest) return;

  Object.entries(quest.reward).forEach(([statKey, amount]) => {
    addStatXP(statKey, amount);
  });
  addCharXP(quest.overallXP);

  state.activeQuests = state.activeQuests.filter(q => q.id !== questId);
  if(state.questPool.length > 0){
    state.activeQuests.push(state.questPool.shift());
  }
  showToast('Quest complete!');
  saveState();
  render();
}

function openTaskModal(){
  const list = document.getElementById('statCheckList');
  list.innerHTML = '';
  Object.keys(state.stats).forEach(s => {
    const id = 'statchk_' + s;
    const wrap = document.createElement('label');
    wrap.innerHTML = '<input type="checkbox" id="' + id + '" value="' + s + '" style="width:auto;"> ' + capitalize(s);
    list.appendChild(wrap);
  });
  document.getElementById('newTaskName').value = '';
  document.getElementById('newStatName').value = '';
  document.getElementById('newTaskFrequency').value = 1;
  document.getElementById('newTaskTarget').value = 10;
  document.getElementById('newTaskGrowth').value = 2;
  document.getElementById('newTaskInterval').value = 7;
  document.getElementById('newTaskIsDeficit').checked = false;
  document.querySelector('input[name=taskType][value=simple]').checked = true;
  toggleProgressiveFields();
  document.getElementById('taskModal').classList.add('open');
}

function closeTaskModal(){
  document.getElementById('taskModal').classList.remove('open');
}

function toggleProgressiveFields(){
  const isProgressive = document.querySelector('input[name=taskType]:checked').value === 'progressive';
  document.getElementById('progressiveFields').classList.toggle('hidden', !isProgressive);
}

function saveNewTask(){
  const name = document.getElementById('newTaskName').value.trim();
  if(!name){ showToast('Give your quest a name first.'); return; }

  const selected = Array.from(document.querySelectorAll('#statCheckList input[type=checkbox]:checked')).map(cb => cb.value);

  const newStatName = document.getElementById('newStatName').value.trim().toLowerCase();
  if(newStatName){
    if(!state.stats[newStatName]){
      state.stats[newStatName] = {xp:0, level:1};
    }
    if(!selected.includes(newStatName)) selected.push(newStatName);
  }

  if(selected.length === 0){
    showToast('Pick at least one stat for this quest.');
    return;
  }

  const frequency = parseInt(document.getElementById('newTaskFrequency').value, 10) || 1;
  const type = document.querySelector('input[name=taskType]:checked').value;
  const isDeficitTask = document.getElementById('newTaskIsDeficit').checked;

  const task = {
    id: 't' + Date.now(),
    name,
    rewards: buildRewards(selected),
    type,
    frequency,
    nextDueDate: todayStr(),
    doneToday:false, streak:0,
    target:null, growth:null, interval:null, originalTarget:null,
    isDeficitTask
  };
  if(type === 'progressive'){
    const target = parseInt(document.getElementById('newTaskTarget').value, 10) || 10;
    task.target = target;
    task.originalTarget = target;
    task.growth = parseInt(document.getElementById('newTaskGrowth').value, 10) || 1;
    task.interval = parseInt(document.getElementById('newTaskInterval').value, 10) || 7;
  }

  state.tasks.push(task);
  closeTaskModal();
  saveState();
  render();
}

function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function render(){
  document.getElementById('charLevelBadge').textContent = state.charLevel;
  const need = xpToNext(state.charLevel);
  document.getElementById('charXpLine').textContent = state.charXP + ' / ' + need + ' XP to next level';
  document.getElementById('charXpBar').style.width = Math.min(100, (state.charXP/need)*100) + '%';

  const statsList = document.getElementById('statsList');
  statsList.innerHTML = '';
  Object.entries(state.stats).forEach(([key, s]) => {
    const need = xpToNext(s.level);
    const pct = Math.min(100, (s.xp/need)*100);
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML =
      '<div class="stat-name">' + capitalize(key) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="stat-lvl">Lv' + s.level + '</div>';
    statsList.appendChild(row);
  });

  const fatKg = state.fatLossKcal / KCAL_PER_KG;
  const fatPct = Math.min(100, (fatKg / FAT_GOAL_KG) * 100);
  document.getElementById('fatLabel').textContent = fatKg.toFixed(1) + ' / ' + FAT_GOAL_KG + ' kg lost';
  document.getElementById('fatBar').style.width = fatPct + '%';

  const taskList = document.getElementById('taskList');
  taskList.innerHTML = '';
  state.tasks.filter(isTaskDueToday).forEach(task => {
    const row = document.createElement('div');
    row.className = 'task';
    const statNames = Object.keys(task.rewards).map(capitalize).join(', ');
    let meta = statNames;
    if(task.frequency > 1){
      meta += ' &middot; every ' + task.frequency + ' days';
    }
    if(task.type === 'progressive'){
      meta += ' &middot; target: ' + task.target + (task.growth ? ' (grows +' + task.growth + ' every ' + task.interval + ' days)' : '');
    }
    if(task.isDeficitTask){
      meta += ' &middot; +' + DEFICIT_PER_TASK + ' kcal deficit';
    }
    row.innerHTML =
      '<input type="checkbox" ' + (task.doneToday ? 'checked' : '') + ' onchange="toggleTask(\'' + task.id + '\', this.checked)" />' +
      '<div class="task-body">' +
        '<div class="task-name ' + (task.doneToday?'done':'') + '">' + task.name + '</div>' +
        '<div class="task-meta">' + meta + '</div>' +
      '</div>' +
      '<button class="task-del" onclick="deleteTask(\'' + task.id + '\')" aria-label="Delete task">&times;</button>';
    taskList.appendChild(row);
  });
  if(taskList.children.length === 0){
    taskList.innerHTML = '<div class="task-meta">Nothing due today — check back tomorrow or add a task.</div>';
  }

  const questList = document.getElementById('sideQuestList');
  questList.innerHTML = '';
  if(state.activeQuests.length === 0){
    questList.innerHTML = '<div class="task-meta">No quests left in the pool — add more ideas later!</div>';
  }
  state.activeQuests.forEach(q => {
    const rewardText = Object.entries(q.reward).map(([k,v]) => '+' + v + ' ' + capitalize(k)).join(', ');
    const card = document.createElement('div');
    card.className = 'quest';
    card.innerHTML =
      '<div class="quest-name">' + q.name + '</div>' +
      '<div class="quest-reward">' + rewardText + ', +' + q.overallXP + ' overall XP</div>' +
      '<button onclick="completeQuest(\'' + q.id + '\')">Mark complete</button>';
    questList.appendChild(card);
  });
}

let toastTimer = null;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

state = loadState();
processRollover();
render();
</script>
</body>
</html>
